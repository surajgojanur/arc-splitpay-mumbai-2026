name: Frontend checks
on:
  push:
    branches: [main, feat/suraj-frontend, feat/suraj-arcstudio-integration]
  pull_request:
    paths: ["web/**", "package*.json", ".github/workflows/web.yml"]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            web/public/screenshots/
            web/test-results/
